name: Practice 6 integration tests

on:
  push:
    branches: ['practice-6*']
    paths:
      - 'services/**'
      - 'docs/practice-6/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: First integration run
        id: first
        run: mvn -B -ntp -f services/pom.xml -Pintegration-tests verify
      - name: Second integration run on the same runner
        if: ${{ !cancelled() && (steps.first.outcome == 'success' || steps.first.outcome == 'failure') }}
        run: mvn -B -ntp -f services/pom.xml -Pintegration-tests verify
      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: services/*/target/failsafe-reports/
          if-no-files-found: ignore
